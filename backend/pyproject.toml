[project]
name = "hiretitan"
version = "0.1.0"
description = "Self-hosted AI job-search assistant (one user per install)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162",
    "uvicorn[standard]>=0.38",
    "pydantic>=2.14",
    "pydantic-settings>=2.16",
    "sqlalchemy[asyncio]>=2.1",
    "alembic>=1.20",
    "psycopg[binary,pool]>=3.3",
    "procrastinate>=3.10",
    "langgraph>=1.2",
    "langgraph-checkpoint-postgres>=3.2",
    "openai>=3.43",
    "tiktoken>=0.14",
    "pdfplumber>=0.11",
    "pypdf>=6.21",
    "python-docx>=1.2",
    "phonenumbers>=9.0",
    "rapidfuzz>=3.14",
    "sse-starlette>=3.6",
    "python-multipart>=0.0.20",
    "pyyaml>=6.0",
    "jinja2>=3.1",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.2",
    "pytest-cov>=7.0",
    "testcontainers[postgres]>=4.15",
    "respx>=0.22",
    "httpx>=0.28",
    "ruff>=0.14",
    "mypy>=1.18",
    "import-linter>=2.15",
    "pip-audit>=2.9",
    "pip-licenses>=5.0",
    "reportlab>=4.4",
    "pillow>=12.0",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hiretitan"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "RUF", "SIM", "ASYNC", "PT", "DTZ"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PT011"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["hiretitan"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "-ra --strict-markers --import-mode=importlib"

[tool.coverage.run]
source = ["hiretitan"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
