# Quality gates (constitution V, research R15). Runs on every PR to master.
name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend gates
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    env:
      HIRETITAN_LLM: fake  # no keys and no cost in CI
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install
        run: uv sync --locked

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format (ruff)
        run: uv run ruff format --check .

      - name: Types (mypy --strict)
        run: uv run mypy --strict src

      - name: Import contracts (import-linter)
        run: uv run lint-imports --no-logo

      - name: Tests with coverage (real PostgreSQL 16 via Testcontainers)
        run: uv run pytest --cov --cov-report=term --cov-report=json:coverage.json

      - name: Coverage gate (domain + application >= 90%, overall >= 80%)
        run: uv run python scripts/check_coverage.py coverage.json

      - name: Vulnerability audit (pip-audit)
        run: uv run pip-audit --skip-editable

      - name: Licence gate (runtime dependencies)
        run: |
          packages=$(uv export --locked --no-dev --no-hashes --no-emit-project --no-header --no-annotate \
            | grep -v '^#' | sed -E 's/[=<>;[ ].*//' | grep -v '^$' | tr '\n' ' ')
          uv run pip-licenses --packages $packages --from=mixed --format=json > licenses.json
          uv run python scripts/check_licenses.py licenses.json

  careerops-contract:
    # Runs the real pinned career-ops providers with every request intercepted and fails on any
    # host, method or path outside backend/.../careerops/allowlist.py (research R2).
    name: career-ops request allowlist
    runs-on: ubuntu-24.04
    env:
      # Keep in step with CAREER_OPS_COMMIT in the Dockerfile (tag career-ops-v1.38.0).
      CAREER_OPS_COMMIT: 115bc9873e3d43e23883f3c8f16436617facc62c
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Fetch the pinned career-ops by commit hash
        run: |
          git init -q "$RUNNER_TEMP/career-ops"
          cd "$RUNNER_TEMP/career-ops"
          git remote add origin https://github.com/santifer/career-ops.git
          git fetch -q --depth 1 origin "$CAREER_OPS_COMMIT"
          git checkout -q FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$CAREER_OPS_COMMIT"

      - name: Install its runtime packages from HireTitan's lockfile (no install scripts)
        run: |
          cd backend/scanner
          npm ci --omit=dev --ignore-scripts
          mv node_modules "$RUNNER_TEMP/career-ops/node_modules"

      - name: Contract tests (recorded outputs and request allowlist)
        working-directory: backend
        env:
          HIRETITAN_LLM: fake
        run: |
          export CAREER_OPS_DIR="$RUNNER_TEMP/career-ops"
          uv run pytest tests/contract/careerops -q

  scanner:
    # The Node packages the pinned career-ops providers need (backend/scanner, research R1).
    name: Scanner package gates
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend/scanner
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/scanner/package-lock.json

      - name: Install (no install scripts, so no browser download)
        run: npm ci --omit=dev --ignore-scripts

      - name: Vulnerability audit (production dependencies)
        run: npm audit --omit=dev

      - name: Licence gate (production dependencies)
        run: >
          npx --yes license-checker@25.0.1 --production --excludePrivatePackages
          --onlyAllow "MIT;MIT-0;BSD;BSD-2-Clause;BSD-3-Clause;0BSD;Apache-2.0;ISC;PSF;Python-2.0;MPL-2.0;LGPL-2.1;LGPL-3.0;OFL-1.1"

  frontend:
    name: Frontend gates
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Types (tsc)
        run: npm run typecheck

      - name: Lint (eslint)
        run: npm run lint

      - name: Tests with coverage (vitest)
        run: npm test -- --coverage

      - name: Vulnerability audit (production dependencies)
        run: npm audit --omit=dev

      - name: Licence gate (production dependencies)
        # Same allowlist as the backend; OFL-1.1 covers the bundled Geist font only.
        run: >
          npx --yes license-checker@25.0.1 --production --excludePrivatePackages
          --onlyAllow "MIT;MIT-0;BSD;BSD-2-Clause;BSD-3-Clause;0BSD;Apache-2.0;ISC;PSF;Python-2.0;MPL-2.0;LGPL-2.1;LGPL-3.0;OFL-1.1"

  compose-smoke:
    name: Compose smoke (Linux, .env.example defaults)
    runs-on: ubuntu-24.04
    env:
      COMPOSE_PROJECT_NAME: hiretitan-smoke
    steps:
      - uses: actions/checkout@v5

      - name: Configure like a new user (copy .env.example, set a password)
        run: |
          cp .env.example .env
          sed -i 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci-only-password/' .env

      - name: Build and start the stack
        run: docker compose up --build -d

      - name: API health and the web app are served
        run: |
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8000/api/v1/health && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:8000/api/v1/health
          curl -fsS http://127.0.0.1:8000/ | grep -q '<div id="root">'
          curl -fsS http://127.0.0.1:8000/profile | grep -q '<div id="root">'  # SPA fallback

      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: Stop
        if: always()
        run: docker compose down -v

  e2e:
    name: End-to-end journey (compose, scripted AI, Chromium)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Prepare the stack (no AI key, scripted replies)
        working-directory: .
        run: |
          cp .env.example .env
          sed -i 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci-only-password/' .env
          node frontend/e2e/prepare.mjs
          docker compose -p hiretitan-e2e -f docker-compose.yml -f docker-compose.e2e.yml up --build -d

      - name: Wait for the API
        run: |
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8000/api/v1/health && exit 0
            sleep 2
          done
          exit 1

      - name: Journey (quickstart A)
        run: npx playwright test

      - name: Logs and trace on failure
        if: failure()
        working-directory: .
        run: docker compose -p hiretitan-e2e -f docker-compose.yml -f docker-compose.e2e.yml logs --no-color --tail 200

      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-trace
          path: frontend/test-results
          if-no-files-found: ignore

      - name: Stop
        if: always()
        working-directory: .
        run: docker compose -p hiretitan-e2e -f docker-compose.yml -f docker-compose.e2e.yml down -v

